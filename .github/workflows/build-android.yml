name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      zip_source:
        description: ZIP source
        required: true
        default: release-asset
        type: choice
        options:
          - release-asset
          - download-url
          - input-directory
      zip_url:
        description: ZIP download URL
        required: false
        default: ""
      release_tag:
        description: Release tag containing ZIP
        required: false
        default: ""
      build_variant:
        description: Build variant
        required: false
        default: auto
      enable_ndk:
        description: Enable NDK
        required: false
        default: "false"

permissions:
  contents: read
  actions: write

jobs:
  build:
    name: Build Ghost Tap APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout AndroidForge
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Get Ghost Tap ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE: ${{ inputs.zip_source }}
          TAG: ${{ inputs.release_tag }}
          ZIP_URL: ${{ inputs.zip_url }}
        run: |
          set -euxo pipefail

          mkdir -p /tmp/ghosttap

          if [ "$SOURCE" = "release-asset" ]; then
            gh release download "$TAG" \
              --repo "${{ github.repository }}" \
              --pattern "*.zip" \
              --dir /tmp/ghosttap
          elif [ "$SOURCE" = "download-url" ]; then
            curl -fL "$ZIP_URL" -o /tmp/ghosttap/project.zip
          else
            cp input/*.zip /tmp/ghosttap/
          fi

          ZIP="$(find /tmp/ghosttap -maxdepth 1 -name '*.zip' | head -1)"

          if [ -z "$ZIP" ]; then
            echo "No ZIP found"
            exit 1
          fi

          mkdir -p /tmp/project
          unzip -q "$ZIP" -d /tmp/project

          ROOT="$(find /tmp/project -maxdepth 3 \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -printf '%h\n' | head -1)"

          if [ -z "$ROOT" ]; then
            echo "Android project root not found"
            find /tmp/project -maxdepth 3 -type f
            exit 1
          fi

          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Project root: $ROOT"

      - name: Install Gradle 8.7
        run: |
          set -euxo pipefail

          wget -q \
            https://services.gradle.org/distributions/gradle-8.7-bin.zip \
            -O /tmp/gradle.zip

          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Configure Android project
        run: |
          set -euxo pipefail
          cd "$PROJECT_ROOT"

          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > local.properties

          mkdir -p gradle/wrapper

          gradle wrapper \
            --gradle-version 8.7 \
            --distribution-type bin

          chmod +x gradlew

          ./gradlew --version

      - name: Build Ghost Tap
        run: |
          set -euxo pipefail
          cd "$PROJECT_ROOT"

          ./gradlew :app:assembleDebug \
            --stacktrace \
            --no-daemon

      - name: Find APK
        run: |
          set -euxo pipefail

          APK="$(find "$PROJECT_ROOT" -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            | head -1)"

          if [ -z "$APK" ]; then
            echo "BUILD COMPLETED BUT APK WAS NOT FOUND"
            find "$PROJECT_ROOT" -type f -name '*.apk'
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/apk-output"

          cp "$APK" \
            "$GITHUB_WORKSPACE/apk-output/GHOST-TAP-debug.apk"

          echo "APK FOUND:"
          ls -lh \
            "$GITHUB_WORKSPACE/apk-output/GHOST-TAP-debug.apk"

      - name: Upload Ghost Tap APK
        uses: actions/upload-artifact@v4
        with:
          name: GHOST-TAP-APK
          path: apk-output/GHOST-TAP-debug.apk
          if-no-files-found: error
