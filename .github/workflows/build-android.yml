name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      zip_source:
        description: ZIP source
        required: true
        default: release-asset
        type: choice
        options:
          - release-asset
          - download-url
          - input-directory
      zip_url:
        description: ZIP download URL
        required: false
        default: ""
      release_tag:
        description: Release tag containing ZIP
        required: false
        default: ""
      build_variant:
        description: Build variant
        required: false
        default: auto
      enable_ndk:
        description: Enable NDK
        required: false
        default: "false"
  push:
    branches:
      - main
    paths:
      - "input/**.zip"
      - ".github/workflows/build-android.yml"

permissions:
  contents: read
  actions: write

jobs:
  build:
    name: Build Ghost Tap APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout AndroidForge
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        run: |
          set -euxo pipefail
          : "${ANDROID_SDK_ROOT:?ANDROID_SDK_ROOT is not set}"
          SDKMGR="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMGR" ]; then
            SDKMGR="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -1)"
          fi
          echo "Using sdkmanager: $SDKMGR"
          yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
          for pkg in "platform-tools" "platforms;android-34" "build-tools;34.0.0"; do
            echo "Ensuring $pkg..."
            yes | "$SDKMGR" "$pkg" >/tmp/sdkmanager.log 2>&1 || tail -5 /tmp/sdkmanager.log
          done
          echo "SDK packages ready:"
          ls "$ANDROID_SDK_ROOT/platforms" "$ANDROID_SDK_ROOT/build-tools"

      - name: Get Ghost Tap ZIP
        id: getzip
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE: ${{ inputs.zip_source }}
          TAG: ${{ inputs.release_tag }}
          ZIP_URL: ${{ inputs.zip_url }}
        run: |
          set -uo pipefail

          mkdir -p /tmp/ghosttap
          GOT=""

          # 1) Try release asset when a tag was actually provided
          if [ "$SOURCE" = "release-asset" ] && [ -n "$TAG" ]; then
            echo "Trying release asset from tag: $TAG"
            if gh release download "$TAG" \
              --repo "${{ github.repository }}" \
              --pattern "*.zip" \
              --dir /tmp/ghosttap 2>/tmp/ghosttap/release-err.log; then
              GOT="release"
            else
              echo "Release download failed, will fall back to input/:"
              cat /tmp/ghosttap/release-err.log || true
            fi
          fi

          # 2) Try direct URL when one was provided
          if [ -z "$GOT" ] && [ "$SOURCE" = "download-url" ] && [ -n "$ZIP_URL" ]; then
            echo "Trying download URL"
            if curl -fL "$ZIP_URL" -o /tmp/ghosttap/project.zip; then
              GOT="url"
            else
              echo "URL download failed, will fall back to input/"
            fi
          fi

          # 3) Fall back to the newest ZIP in input/ (covers manual runs
          #    and web-UI uploads, which land in input/)
          if [ -z "$GOT" ]; then
            NEWEST="$(ls -t input/*.zip 2>/dev/null | head -1 || true)"
            if [ -n "$NEWEST" ]; then
              echo "Falling back to newest input ZIP: $NEWEST"
              cp "$NEWEST" /tmp/ghosttap/
              GOT="input"
            fi
          fi

          if [ -z "$GOT" ]; then
            echo "::error::No ZIP found. Provide a release tag, a download URL, or put a ZIP in input/."
            exit 1
          fi

          ZIP="$(ls -t /tmp/ghosttap/*.zip | head -1)"
          echo "Using ZIP: $ZIP"
          echo "zip_path=$ZIP" >> "$GITHUB_OUTPUT"

          rm -rf /tmp/project
          mkdir -p /tmp/project
          unzip -q "$ZIP" -d /tmp/project

          ROOT="$(find /tmp/project -maxdepth 3 \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -printf '%h\n' | head -1)"

          if [ -z "$ROOT" ]; then
            echo "::error::No Android project found in ZIP (no settings.gradle[.kts]). Files at top level:"
            find /tmp/project -maxdepth 2 | head -20
            exit 1
          fi

          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Project root: $ROOT"

      - name: Apply source compatibility fixes
        run: |
          set -euxo pipefail
          # Some generated projects reference Theme.Material3.Dark.NoActionBar,
          # which does not exist (Material3 has no NoActionBar variants).
          # Fall back to Theme.Material3.Dark — Compose apps have no ActionBar anyway.
          find "$PROJECT_ROOT" -name "themes.xml" -path "*res/values*" \
            -exec sed -i 's/Theme\.Material3\.Dark\.NoActionBar/Theme.Material3.Dark/g' {} +
          echo "themes.xml parent themes now:"
          grep -h "style name=" "$PROJECT_ROOT"/app/src/main/res/values/themes.xml || true

      - name: Install Gradle 8.7
        run: |
          set -euxo pipefail

          if [ ! -x /opt/gradle-8.7/bin/gradle ]; then
            wget -q \
              https://services.gradle.org/distributions/gradle-8.7-bin.zip \
              -O /tmp/gradle.zip
            unzip -q /tmp/gradle.zip -d /opt
          fi
          echo "/opt/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Configure Android project
        run: |
          set -euxo pipefail
          cd "$PROJECT_ROOT"

          : "${ANDROID_SDK_ROOT:?ANDROID_SDK_ROOT is not set}"

          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > local.properties

          mkdir -p gradle/wrapper

          gradle wrapper \
            --gradle-version 8.7 \
            --distribution-type bin

          chmod +x gradlew

          ./gradlew --version

      - name: Build Ghost Tap
        id: build
        run: |
          set -uo pipefail
          cd "$PROJECT_ROOT"

          ./gradlew :app:assembleDebug \
            --stacktrace \
            --no-daemon 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          # pipefail makes the step fail if gradle failed

      - name: Surface build errors
        if: failure() && steps.build.conclusion == 'failure'
        run: |
          echo "=== Tail of Gradle log ==="
          tail -60 "$GITHUB_WORKSPACE/build.log" || echo "(no build log)"
          echo "=== End tail ==="
          # Publish the failing lines as a public annotation so the error
          # is visible on the run page without downloading logs.
          if [ -f "$GITHUB_WORKSPACE/build.log" ]; then
            TAIL="$(grep -E "What went wrong|error:|FAILED|Execution failed" -A 6 "$GITHUB_WORKSPACE/build.log" | tail -40 | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | awk '{printf "%s%%0A", $0}')"
            if [ -n "$TAIL" ]; then
              echo "::error::Gradle build failed:%0A${TAIL}"
            else
              echo "::error::Gradle build failed. See the 'Surface build errors' step log for the tail."
            fi
          fi

      - name: Find APK
        if: success()
        run: |
          set -euxo pipefail

          APK="$(find "$PROJECT_ROOT" -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            | head -1)"

          if [ -z "$APK" ]; then
            echo "::error::BUILD COMPLETED BUT APK WAS NOT FOUND"
            find "$PROJECT_ROOT" -type f -name '*.apk' || true
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/apk-output"

          cp "$APK" \
            "$GITHUB_WORKSPACE/apk-output/GHOST-TAP-debug.apk"

          echo "APK FOUND:"
          ls -lh \
            "$GITHUB_WORKSPACE/apk-output/GHOST-TAP-debug.apk"

      - name: Upload Ghost Tap APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GHOST-TAP-APK
          path: apk-output/GHOST-TAP-debug.apk
          if-no-files-found: error
